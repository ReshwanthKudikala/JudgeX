# JudgeX CI — fail-fast lint/build/test on PR and main.
# Caches npm dependencies per package lockfile.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_NAME: JudgeX
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: npm run build

  backend-lint:
    name: Backend (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (syntax)
        run: npm run lint

  backend-unit:
    name: Backend (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-unit-secret-change-me-32chars!!!!
          LOG_LEVEL: error

  backend-integration:
    name: Backend (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: judgex
          POSTGRES_PASSWORD: judgex
          POSTGRES_DB: judgex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judgex -d judgex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-integration-secret-change-me-32chars
          LOG_LEVEL: error
          DATABASE_URL: postgres://judgex:judgex@localhost:5432/judgex
          REDIS_URL: redis://localhost:6379
          DB_REQUIRED: "true"
          REDIS_REQUIRED: "false"
          BCRYPT_SALT_ROUNDS: "4"
          INFRA_STARTUP_RETRIES: "10"
          INFRA_STARTUP_RETRY_DELAY_MS: "500"
          RATE_LIMIT_ENABLED: "false"

  backend-e2e:
    name: Backend (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: judgex
          POSTGRES_PASSWORD: judgex
          POSTGRES_DB: judgex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judgex -d judgex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # Host Docker on the GitHub runner. The job does not use production
      # Compose, production env files, or a privileged sidecar.
      - name: Check Docker daemon
        run: docker info

      - name: Build sandbox images
        run: |
          docker build -t judgex-python:latest docker/images/python
          docker build -t judgex-cpp:latest docker/images/cpp

      - name: Verify isolated test database
        working-directory: backend
        env:
          DATABASE_URL: postgres://judgex:judgex@localhost:5432/judgex_test
          REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          node <<'EOF'
          const { Client } = require('pg');
          const Redis = require('ioredis');

          async function main() {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const result = await client.query('SELECT current_database() AS name');
            const name = result.rows[0] && result.rows[0].name;
            await client.end();
            if (name !== 'judgex_test') {
              throw new Error(`Refusing e2e: connected database is ${name}`);
            }

            const redis = new Redis(process.env.REDIS_URL, { maxRetriesPerRequest: 1 });
            const pong = await redis.ping();
            const db = Number(redis.options.db);
            await redis.quit();
            if (pong !== 'PONG' || db !== 15) {
              throw new Error(`Refusing e2e: Redis ping=${pong} db=${db}`);
            }
            console.log('current_database=judgex_test redis_db=15');
          }

          main().catch((err) => {
            console.error(err && err.message ? err.message : err);
            process.exit(1);
          });
          EOF

      - name: End-to-end judge tests
        working-directory: backend
        run: npm run test:e2e
        env:
          E2E_REQUIRED: "true"
          E2E_TEST_TIMEOUT_MS: "120000"
          NODE_ENV: test
          JWT_SECRET: ci-e2e-secret-change-me-32chars!!
          LOG_LEVEL: error
          DATABASE_URL: postgres://judgex:judgex@localhost:5432/judgex_test
          REDIS_URL: redis://127.0.0.1:6379/15
          DB_REQUIRED: "true"
          REDIS_REQUIRED: "true"
          BCRYPT_SALT_ROUNDS: "4"
          INFRA_STARTUP_RETRIES: "10"
          INFRA_STARTUP_RETRY_DELAY_MS: "500"
          RATE_LIMIT_ENABLED: "false"

      - name: Remove leftover sandboxes
        if: always()
        run: |
          set -euo pipefail
          mapfile -t ids < <(docker ps -aq --filter label=judgex.sandbox=true)
          if ((${#ids[@]})); then
            docker rm -f "${ids[@]}"
          fi
          find "${TMPDIR:-/tmp}" /tmp -maxdepth 1 -name 'judgex-*' -exec rm -rf {} +

  backend-audit:
    name: Backend (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        # Informational. The remaining production high is nodemailer 6 → 10.
        # Do not fail the merge gate on this job. See docs/NODEMAILER_UPGRADE.md.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend-audit:
    name: Frontend (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
